name: Compilar APK

# Roda a cada envio para a main, em todo pull request e também pode ser
# disparado manualmente pela aba Actions do GitHub — útil para gerar um APK
# sem precisar mudar nada no código.
#
# O gatilho de pull request é o que faz os testes rodarem na proposta de
# quem contribui, antes do merge. Sem ele, um PR só era verificado depois de
# já estar na main.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rodar os testes da simulação
        run: ./gradlew core:test

      - name: Compilar o APK de depuração
        run: ./gradlew android:assembleDebug

      # O APK gerado fica anexado na execução, na aba Actions do GitHub —
      # dá pra baixar direto pelo navegador do celular, sem precisar de PC.
      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: mundo-vivo-debug
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 30

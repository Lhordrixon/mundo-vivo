name: 🙋 Dúvida numa aula
description: Travou numa aula de aprender/? Conte onde. Uma resposta automática chega em minutos.
title: "Dúvida: "
labels: ["duvida"]
body:
  - type: markdown
    attributes:
      value: |
        Travar faz parte de aprender. Não existe pergunta boba.
  - type: dropdown
    id: aula
    attributes:
      label: Aula
      options:
        - 0.0 Preparar celular e PC
        - 0.1 O mapa é uma lista de listas
        - 0.2 A criatura é um dicionário
        - 0.3 Funções que mudam a criatura
        - "0.4 Muitas criaturas: por que classe"
        - 1.1 O mapa nasce de uma semente
        - 1.2 Andar
        - 1.3 Fome
        - 1.4 Comer
        - 1.5 Morrer
        - 1.6 Reproduzir
        - 1.7 O loop do mundo
        - 2.1 Ler Java
        - 2.2 Primeiro PR pelo celular
        - 2.3 Primeiro PR pelo PC
        - 2.4 Mudar uma cor e ver no APK
        - 2.5 Mudar um parâmetro e ver no APK
        - 3.0 O jogo no seu PC
        - 3.1 Ler um teste
        - 3.2 O teste da comida
        - 3.3 Consertar um bug
        - 4.1 Desenhar o território
        - 4.2 Mudar o terreno com o dedo
        - 4.3 Um gene que se vê
        - 4.4 O seu projeto
        - Prova N0
        - Prova N1
        - Prova N2
        - Prova N3
        - Outra coisa
    validations:
      required: true
  - type: dropdown
    id: passo
    attributes:
      label: Passo
      description: Em que parte da aula você travou?
      options:
        - Prever
        - Rodar
        - Investigar
        - Mudar
        - Montar
        - Instalar
        - APK
        - PR
    validations:
      required: true
  - type: textarea
    id: erro
    attributes:
      label: Mensagem de erro
      description: Cole a mensagem que apareceu, inteira. Se não teve erro, deixe em branco.
      placeholder: "AssertionError: Troque o None da nova."
      render: text
  - type: textarea
    id: tentei
    attributes:
      label: O que tentei
      description: O que você fez, passo a passo. Pode colar o seu código.
      placeholder: "Troquei o None por 3 e rodei."
    validations:
      required: true
